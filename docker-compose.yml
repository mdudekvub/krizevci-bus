services:
  db:
    image: postgres:17
    container_name: krizevci-bus-db
    environment:
      POSTGRES_DB: krizevcibus
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: